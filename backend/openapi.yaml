openapi: 3.1.0
info:
  title: Recicla Palhoça API
  version: 1.0.0
  description: |
    Especificação dos endpoints iniciais implementados no backend do Recicla Palhoça.
    A API permite consultar centros e materiais publicamente e oferece autenticação
    e operações de gestão de centros para seus responsáveis.
servers:
  - url: /
    description: Mesmo host em que a documentação foi aberta (local ou publicado)
tags:
  - name: Health
    description: Disponibilidade da API e conexão com o banco.
  - name: Autenticação
    description: Cadastro, login e identidade do responsável.
  - name: Materiais
    description: Consulta do catálogo controlado pelo sistema.
  - name: Centros
    description: Consulta pública e gestão do perfil do próprio centro.
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Verifica se o processo HTTP está ativo
      operationId: getLiveness
      responses:
        "200":
          description: Processo HTTP ativo.
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    example: recicla-palhoca-api
  /health:
    get:
      tags: [Health]
      summary: Verifica a disponibilidade da API e do MySQL
      operationId: getHealth
      responses:
        "200":
          description: API disponível e banco conectado.
          content:
            application/json:
              schema:
                type: object
                required: [status, service, database]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    example: recicla-palhoca-api
                  database:
                    type: string
                    const: connected
        "503":
          description: Banco de dados indisponível.
          content:
            application/json:
              schema:
                type: object
                required: [status, service, database]
                properties:
                  status:
                    type: string
                    const: error
                  service:
                    type: string
                    example: recicla-palhoca-api
                  database:
                    type: string
                    const: unavailable
  /auth/register:
    post:
      tags: [Autenticação]
      summary: Cadastra uma conta de responsável
      operationId: registerResponsible
      description: |
        Normaliza o nome e o e-mail, armazena a senha com hash bcrypt e emite
        um token JWT Bearer com validade de uma hora. A senha deve ter de 10
        a 128 caracteres e no máximo 72 bytes em UTF-8.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              fullName: "Ana da Silva"
              email: "ana@example.com"
              password: "senha-segura-123"
      responses:
        "201":
          description: Conta criada e token emitido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Nome, e-mail ou senha inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Já existe uma conta com o e-mail informado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Segredo JWT não configurado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Falha interna ao criar a conta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica um responsável
      operationId: loginResponsible
      description: |
        Valida e-mail e senha. Contas inexistentes, inativas ou com senha
        incorreta recebem a mesma resposta de credenciais inválidas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: "ana@example.com"
              password: "senha-segura-123"
      responses:
        "200":
          description: Credenciais válidas e token emitido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Corpo da requisição inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: E-mail ou senha inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Segredo JWT não configurado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Falha interna durante a autenticação.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/me:
    get:
      tags: [Autenticação]
      summary: Consulta a identidade do responsável autenticado
      operationId: getCurrentResponsible
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dados públicos do responsável autenticado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Responsible"
        "401":
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Não foi possível validar a autenticação.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /materials:
    get:
      tags: [Materiais]
      summary: Lista os materiais ativos do catálogo
      operationId: listMaterials
      description: Retorna os materiais ativos em ordem alfabética. Não exige autenticação.
      responses:
        "200":
          description: Catálogo consultado. A lista pode estar vazia.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Material"
        "500":
          description: Falha ao consultar o catálogo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /centers:
    get:
      tags: [Centros]
      summary: Lista centros publicáveis
      operationId: listCenters
      description: |
        Consulta pública. Retorna somente centros ativos com coordenadas,
        ao menos um horário e ao menos um material ativo aceito. Os filtros,
        quando combinados, são aplicados simultaneamente.
      parameters:
        - name: q
          in: query
          required: false
          description: Busca textual por nome ou bairro (até 160 caracteres).
          schema:
            type: string
            maxLength: 160
        - name: neighborhood
          in: query
          required: false
          description: Filtro por bairro (até 100 caracteres).
          schema:
            type: string
            maxLength: 100
        - name: material
          in: query
          required: false
          description: Slug do material aceito (até 120 caracteres).
          schema:
            type: string
            maxLength: 120
        - name: offersPickup
          in: query
          required: false
          description: Filtra centros que oferecem coleta.
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Lista de centros. Sem correspondências, retorna data vazio.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CenterProfile"
        "400":
          description: Um ou mais filtros são inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Falha ao consultar centros.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Centros]
      summary: Cadastra o centro do responsável autenticado
      operationId: createCenter
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CenterWriteRequest"
            example:
              name: "Centro de Reciclagem Exemplo"
              publicPhone: "4833334444"
              postalCode: "88130000"
              street: "Rua de Exemplo"
              streetNumber: "100"
              addressComplement: null
              neighborhood: "Centro"
              city: "Palhoça"
              state: "SC"
              latitude: -27.645
              longitude: -48.669
              acceptsDropoff: true
              offersPickup: true
              openingHours:
                - dayOfWeek: 1
                  periodNumber: 1
                  opensAt: "09:00"
                  closesAt: "17:00"
              materialIds: [5]
      responses:
        "201":
          description: Centro cadastrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CenterResponse"
        "400":
          description: Dados inválidos ou materiais inexistentes/inativos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Autenticação necessária.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Responsável inexistente ou inativo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Responsável já possui um centro cadastrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Falha interna ao cadastrar o centro.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Serviço de autenticação indisponível ou não configurado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /centers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador inteiro positivo do centro.
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Centros]
      summary: Consulta os detalhes públicos de um centro
      operationId: getCenter
      responses:
        "200":
          description: Centro encontrado e publicável.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CenterResponse"
        "400":
          description: Identificador inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Centro inexistente ou não publicável.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Falha ao consultar o centro.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [Centros]
      summary: Atualiza o perfil do próprio centro
      operationId: updateCenter
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CenterWriteRequest"
      responses:
        "200":
          description: Centro atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CenterResponse"
        "400":
          description: Identificador ou dados inválidos; pode incluir material inexistente/inativo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Autenticação necessária.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Responsável inexistente ou inativo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Centro não encontrado para o responsável autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflito de integridade no cadastro do centro.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Falha interna ao atualizar o centro.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Serviço de autenticação indisponível ou não configurado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Centros]
      summary: Desativa logicamente o próprio centro
      operationId: deactivateCenter
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Centro desativado; a resposta não possui corpo.
        "400":
          description: Identificador inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Autenticação necessária.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Responsável inexistente ou inativo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Centro não encontrado para o responsável autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Falha interna ao desativar o centro.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Serviço de autenticação indisponível ou não configurado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acesso emitido por /auth/register ou /auth/login.
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: validation_error
        message:
          type: string
          example: Os dados informados são inválidos.
    RegisterRequest:
      type: object
      required: [fullName, email, password]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 191
        password:
          type: string
          minLength: 10
          maxLength: 128
          description: Limite adicional de 72 bytes em UTF-8.
          writeOnly: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 191
        password:
          type: string
          minLength: 1
          description: Deve corresponder à senha cadastrada; limite de 72 bytes em UTF-8.
          writeOnly: true
    Responsible:
      type: object
      required: [id, fullName, email]
      properties:
        id:
          type: integer
          minimum: 1
        fullName:
          type: string
        email:
          type: string
          format: email
    AuthResponse:
      type: object
      required: [data, token, tokenType, expiresIn]
      properties:
        data:
          $ref: "#/components/schemas/Responsible"
        token:
          type: string
          description: JWT de acesso. Não compartilhar nem registrar em logs.
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          const: 3600
          description: Validade do token em segundos.
    Material:
      type: object
      required: [id, name, slug, description]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, "null"]
    OpeningHourInput:
      type: object
      required: [dayOfWeek, periodNumber, opensAt, closesAt]
      properties:
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: Dia da semana, de 1 a 7.
        periodNumber:
          type: integer
          minimum: 1
          maximum: 255
        opensAt:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9])?$"
          description: Aceita HH:mm ou HH:mm:ss; o servidor normaliza para HH:mm:ss.
          example: "09:00"
        closesAt:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9])?$"
          description: Deve ser posterior ao horário de abertura.
          example: "17:00"
    OpeningHour:
      allOf:
        - $ref: "#/components/schemas/OpeningHourInput"
      description: Horário retornado pela API, normalizado no formato HH:mm:ss.
      properties:
        opensAt:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$"
          example: "09:00:00"
        closesAt:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$"
          example: "17:00:00"
    CenterMaterial:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        slug:
          type: string
    CenterProfile:
      type: object
      required: [id, name, publicPhone, address, coordinates, services, isActive, openingHours, materials]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        publicPhone:
          type: string
        address:
          type: object
          required: [postalCode, street, streetNumber, complement, neighborhood, city, state]
          properties:
            postalCode:
              type: string
              pattern: "^[0-9]{8}$"
            street:
              type: string
            streetNumber:
              type: string
            complement:
              type: [string, "null"]
            neighborhood:
              type: string
            city:
              type: string
            state:
              type: string
              pattern: "^[A-Z]{2}$"
        coordinates:
          type: object
          required: [latitude, longitude]
          properties:
            latitude:
              type: [number, "null"]
              minimum: -90
              maximum: 90
            longitude:
              type: [number, "null"]
              minimum: -180
              maximum: 180
        services:
          type: object
          required: [acceptsDropoff, offersPickup]
          properties:
            acceptsDropoff:
              type: boolean
            offersPickup:
              type: boolean
        isActive:
          type: boolean
        openingHours:
          type: array
          items:
            $ref: "#/components/schemas/OpeningHour"
        materials:
          type: array
          items:
            $ref: "#/components/schemas/CenterMaterial"
    CenterResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CenterProfile"
    CenterWriteRequest:
      type: object
      required:
        - name
        - publicPhone
        - postalCode
        - street
        - streetNumber
        - neighborhood
        - latitude
        - longitude
        - acceptsDropoff
        - offersPickup
        - openingHours
        - materialIds
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        publicPhone:
          type: string
          minLength: 1
          maxLength: 20
        postalCode:
          type: string
          pattern: "^[0-9]{5}-?[0-9]{3}$"
          description: O servidor normaliza o CEP para oito dígitos.
        street:
          type: string
          minLength: 1
          maxLength: 160
        streetNumber:
          type: string
          minLength: 1
          maxLength: 20
        addressComplement:
          type: [string, "null"]
          maxLength: 100
        neighborhood:
          type: string
          minLength: 1
          maxLength: 100
        city:
          type: string
          maxLength: 100
          default: Palhoça
        state:
          type: string
          pattern: "^[A-Za-z]{2}$"
          default: SC
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        acceptsDropoff:
          type: boolean
        offersPickup:
          type: boolean
        openingHours:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/OpeningHourInput"
        materialIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: integer
            minimum: 1
