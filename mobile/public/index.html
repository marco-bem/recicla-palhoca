<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#126B50" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      .pwa-standalone,
      .pwa-standalone #root {
        touch-action: pan-x pan-y;
      }

      .pwa-standalone #root :is(input, textarea, select) {
        font-size: 16px;
      }
    </style>
    <script>
      if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) {
        document.documentElement.classList.add('pwa-standalone');
        const viewport = document.querySelector('meta[name="viewport"]');
        viewport.content += ', minimum-scale=1, maximum-scale=1, user-scalable=no';

        // WebKit can handle pinch gestures independently of the viewport limits.
        const preventPageZoom = (event) => event.preventDefault();
        document.addEventListener('gesturestart', preventPageZoom, { passive: false });
        document.addEventListener('gesturechange', preventPageZoom, { passive: false });
      }
    </script>
  </head>

  <body>
    <noscript>Ative o JavaScript para abrir o ReciclaPalhoça.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
