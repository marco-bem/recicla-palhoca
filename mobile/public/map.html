<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Mapa de centros de reciclagem</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css"
    />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f7faf7;
      }

      body {
        font-family: Arial, sans-serif;
      }

      #map {
        position: absolute;
        inset: 0;
      }

      .maplibregl-ctrl-attrib {
        font-size: 10px;
      }

      .maplibregl-popup-content {
        padding: 0;
        overflow: hidden;
        border: 1px solid #d8e7df;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(25, 59, 49, 0.16);
      }

      .maplibregl-popup-tip {
        border-top-color: #fff;
        border-bottom-color: #fff;
      }

      .center-map-popup {
        display: flex;
        width: max-content;
        max-width: 240px;
        flex-direction: column;
        gap: 2px;
        padding: 10px 14px;
        border: 0;
        background: #fff;
        color: #193b31;
        font-family: Arial, sans-serif;
        text-align: left;
        cursor: pointer;
      }

      .center-map-popup:focus-visible {
        outline: 2px solid #086faf;
        outline-offset: -2px;
      }

      .center-map-popup-name {
        overflow-wrap: anywhere;
        font-size: 14px;
        font-weight: 600;
        line-height: 20px;
      }

      .center-map-popup-hint {
        color: #557166;
        font-size: 12px;
        line-height: 16px;
      }
    </style>
  </head>
  <body>
    <div
      id="map"
      role="application"
      aria-label="Mapa interativo dos centros de reciclagem"
    ></div>
    <script type="module" src="/map.js"></script>
  </body>
</html>
