<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Mapa de centros de reciclagem</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css"
    />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f7faf7;
      }

      body {
        font-family: Arial, sans-serif;
      }

      #map {
        position: absolute;
        inset: 0 0 26px;
      }

      #map-attribution {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        min-height: 26px;
        align-items: center;
        justify-content: flex-end;
        gap: 3px;
        box-sizing: border-box;
        padding: 0 9px;
        background: #f7faf7;
        color: #52695f;
        font-size: 10px;
        line-height: 1.3;
        white-space: nowrap;
      }

      #map-attribution a {
        color: inherit;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div
      id="map"
      role="application"
      aria-label="Mapa interativo dos centros de reciclagem"
    ></div>
    <div id="map-attribution" aria-label="Créditos cartográficos">
      ©
      <a href="https://www.openmaptiles.org/" target="_blank" rel="noreferrer">
        OpenMapTiles
      </a>
      · Dados de
      <a
        href="https://www.openstreetmap.org/copyright"
        target="_blank"
        rel="noreferrer"
      >
        OpenStreetMap
      </a>
    </div>
    <script type="module" src="/map.js"></script>
  </body>
</html>
